services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexusai-postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./java-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URI: redis://redis:6379
      NEXUS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      NEXUS_DB_USER: ${POSTGRES_USER}
      NEXUS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NEXUS_ADMIN_USERNAME: ${NEXUS_ADMIN_USERNAME:?Set admin username}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:?Set admin password}
      NEXUS_VIEWER_USERNAME: ${NEXUS_VIEWER_USERNAME:?Set viewer username}
      NEXUS_VIEWER_PASSWORD: ${NEXUS_VIEWER_PASSWORD:?Set viewer password}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./nexusai-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

volumes:
  nexusai-postgres-data:
  prometheus-data:
